name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Run linter
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Run type check
        run: npm run check

      - name: Run tests with coverage
        run: npm run test:coverage
        # Vitest is configured with 90% coverage thresholds and will fail if not met

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E - accessibility
        run: npx playwright test tests/e2e/accessibility.spec.ts

      - name: Run E2E - button
        run: npx playwright test tests/e2e/button.spec.ts

      - name: Run E2E - favorite-flow
        run: npx playwright test tests/e2e/favorite-flow.spec.ts

      - name: Run E2E - home
        run: npx playwright test tests/e2e/home.spec.ts

      - name: Run E2E - inventory-box-edit
        run: npx playwright test tests/e2e/inventory-box-edit.spec.ts

      - name: Run E2E - inventory
        run: npx playwright test tests/e2e/inventory.spec.ts

      - name: Run E2E - manual-flow
        run: npx playwright test tests/e2e/manual-flow.spec.ts

      - name: Run E2E - random-flow
        run: npx playwright test tests/e2e/random-flow.spec.ts

      - name: Run E2E - rearrange
        run: npx playwright test tests/e2e/rearrange.spec.ts

      - name: Run E2E - routing
        run: npx playwright test tests/e2e/routing.spec.ts

      - name: Build project
        run: npm run build

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
