<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg-gradient)"/>

  <!-- Protein shaker bottle shape -->
  <g transform="translate(256, 256)">
    <!-- Shaker lid -->
    <rect x="-45" y="-200" width="90" height="30" rx="8" fill="#FFF" opacity="0.95"/>
    <rect x="-35" y="-185" width="70" height="15" rx="5" fill="#E5E7EB"/>

    <!-- Shaker body -->
    <path d="M -60 -170 L -70 60 Q -70 80 -50 90 L 50 90 Q 70 80 70 60 L 60 -170 Z"
          fill="#FFF" opacity="0.95"/>

    <!-- Shaker measurement lines -->
    <line x1="-65" y1="-100" x2="65" y2="-100" stroke="#E5E7EB" stroke-width="2"/>
    <line x1="-67" y1="-30" x2="67" y2="-30" stroke="#E5E7EB" stroke-width="2"/>
    <line x1="-68" y1="40" x2="68" y2="40" stroke="#E5E7EB" stroke-width="2"/>

    <!-- BB text overlay -->
    <text x="0" y="20"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="120"
          font-weight="900"
          fill="#4F46E5"
          text-anchor="middle"
          dominant-baseline="middle">BB</text>
  </g>
</svg>
